name: 🧪 Test

on:
  push:
    branches: [ "**" ]

  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 🧹 lint
    uses: ./.github/workflows/reusable-lint.yml

  test:
    name: 🧪 test
    uses: ./.github/workflows/reusable-test.yml
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    with:
      python-version: ${{ matrix.python-version }}
    secrets: inherit
