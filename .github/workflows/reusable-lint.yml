name: Lint

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
        required: false

jobs:
  action:
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install ruff
      - run: ruff check ui_coverage_scenario_tool conftest.py scripts
    runs-on: ubuntu-latest
